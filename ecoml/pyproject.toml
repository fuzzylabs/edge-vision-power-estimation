[project]
name = "ecoml"
version = "0.1.0"
description = "Predict energy consumption of PyTorch CNN models on Jetson Orin"
readme = "README.md"
authors = [
    { name = "fuzzylabs", email = "info@fuzzylabs.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "dagshub>=0.5.5",
    "mlflow==2.18.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.6",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "cloudpickle==3.1.0",
    "psutil==6.1.0",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "numpy==2.1.2",
    "tqdm>=4.67.1",
]

[project.scripts]
ecoml = "ecoml.ecoml:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
